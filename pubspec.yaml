name: panen_sawit_app
description: HARVESTTRACK
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 FIREBASE (Versi Stabil)
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  # 🔥 UI & BASIC
  cupertino_icons: ^1.0.9
  shared_preferences: 2.3.2 # Kunci versi
  intl: ^0.19.0

  # 🔥 DATABASE
  sqflite: 2.3.3+1 # Kunci versi
  path: ^1.9.1
  path_provider: ^2.1.5

  # 🔥 DEVICE FEATURE (Kunci versi untuk menghindari SDK 36)
  image_picker: 1.1.2
  geolocator: 13.0.2
  camera: 0.11.0+2

  # 🔥 MAP
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # 🔥 CHART
  fl_chart: ^0.69.0

  # 🔥 EXPORT FILE
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6

  # 🔥 FIX
  open_filex: ^4.5.0

  # 🔥 NETWORK
  http: ^1.2.2
  connectivity_plus: ^6.1.5 # Kunci versi

  # 🔥 SHARE
  share_plus: 10.0.2 # Kunci versi

  # 🔥 URL
  url_launcher: 6.3.0 # Kunci versi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
